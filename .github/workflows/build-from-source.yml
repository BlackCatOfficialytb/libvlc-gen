name: Build LibVLC from Source

on:
  workflow_dispatch:
    inputs:
      vlc_version:
        description: 'VLC version/tag to build (e.g., 3.0.20, master)'
        type: string
        required: true
        default: '3.0.20'
      arch:
        description: 'Target architecture'
        type: choice
        required: true
        default: 'arm64'
        options:
          - arm64
          - arm64e
      enable_debug:
        description: 'Enable debug symbols'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build LibVLC from Source (${{ github.event.inputs.arch }})
    runs-on: macos-14
    timeout-minutes: 120
    
    env:
      VLC_VERSION: ${{ github.event.inputs.vlc_version }}
      ARCH: ${{ github.event.inputs.arch }}
      ENABLE_DEBUG: ${{ github.event.inputs.enable_debug }}
    
    steps:
      - name: Checkout libvlc-gen repository
        uses: actions/checkout@v4
      
      - name: Checkout VLC source code
        uses: actions/checkout@v4
        with:
          repository: videolan/vlc
          ref: ${{ env.VLC_VERSION }}
          path: vlc-source
          submodules: recursive
      
      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config gettext wget yasm nasm
          # Install Python dependencies for build scripts
          pip3 install --user requests
      
      - name: Configure build environment
        run: |
          echo "VLC_SOURCE_DIR=$(pwd)/vlc-source" >> $GITHUB_ENV
          echo "BUILD_DIR=$(pwd)/build" >> $GITHUB_ENV
          echo "DIST_DIR=$(pwd)/dist" >> $GITHUB_ENV
      
      - name: Build LibVLC for iOS
        working-directory: ${{ env.VLC_SOURCE_DIR }}/extras/package/ios
        run: |
          chmod +x build.sh
          ./build.sh -a ${{ env.ARCH }} ${{ env.ENABLE_DEBUG == 'true' && '-d' || '' }}
        env:
          # Ensure we use the correct SDK
          IPHONEOS_DEPLOYMENT_TARGET: 12.0
      
      - name: Locate built artifacts
        id: locate
        run: |
          # The build script outputs to build/ directory
          BUILD_OUTPUT="${{ env.VLC_SOURCE_DIR }}/extras/package/ios/build"
          
          # Find the framework
          FRAMEWORK=$(find "$BUILD_OUTPUT" -name "*.framework" -type d | head -1)
          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: No framework found in $BUILD_OUTPUT"
            find "$BUILD_OUTPUT" -type f -name "*.a" | head -20
            exit 1
          fi
          
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT
          echo "Found framework: $FRAMEWORK"
      
      - name: Extract headers and libraries
        run: |
          FRAMEWORK="${{ steps.locate.outputs.framework }}"
          FRAMEWORK_NAME=$(basename "$FRAMEWORK" .framework)
          
          # Create dist structure
          mkdir -p "${{ env.DIST_DIR }}/include/vlc"
          mkdir -p "${{ env.DIST_DIR }}/lib"
          
          # Copy headers
          if [ -d "$FRAMEWORK/Headers" ]; then
            cp "$FRAMEWORK/Headers"/*.h "${{ env.DIST_DIR }}/include/vlc/"
          elif [ -d "$FRAMEWORK/Modules/vlc/Headers" ]; then
            cp "$FRAMEWORK/Modules/vlc/Headers"/*.h "${{ env.DIST_DIR }}/include/vlc/"
          fi
          
          # Copy modulemap if exists
          if [ -f "$FRAMEWORK/Modules/module.modulemap" ]; then
            cp "$FRAMEWORK/Modules/module.modulemap" "${{ env.DIST_DIR }}/include/vlc/"
          fi
          
          # Copy static library (the framework binary)
          if [ -f "$FRAMEWORK/$FRAMEWORK_NAME" ]; then
            cp "$FRAMEWORK/$FRAMEWORK_NAME" "${{ env.DIST_DIR }}/lib/libvlc.a"
            cp "$FRAMEWORK/$FRAMEWORK_NAME" "${{ env.DIST_DIR }}/lib/libvlccore.a"
          fi
          
          # Also look for individual .a files in the build directory
          find "$BUILD_OUTPUT" -name "*.a" -type f | while read lib; do
            cp "$lib" "${{ env.DIST_DIR }}/lib/"
          done
      
      - name: Verify build output
        run: |
          echo "=== Headers ==="
          ls -la "${{ env.DIST_DIR }}/include/vlc/"
          echo ""
          echo "=== Libraries ==="
          ls -la "${{ env.DIST_DIR }}/lib/"
          echo ""
          echo "=== Library sizes ==="
          for lib in "${{ env.DIST_DIR }}/lib"/*.a; do
            if [ -f "$lib" ]; then
              size=$(stat -f%z "$lib")
              echo "$(basename "$lib"): $size bytes ($(echo "scale=2; $size/1024/1024" | bc) MB)"
            fi
          done
      
      - name: Create release archive
        run: |
          cd "${{ env.DIST_DIR }}"
          zip -r "../../libvlc-ios-${{ env.ARCH }}-from-source.zip" .
          cd ../..
          ls -lh libvlc-*.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-ios-${{ env.ARCH }}-from-source
          path: libvlc-ios-${{ env.ARCH }}-from-source.zip
          retention-days: 30
      
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: libvlc-ios-${{ env.ARCH }}-from-source.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}-ios-${{ env.ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}