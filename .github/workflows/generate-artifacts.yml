name: Generate LibVLC Artifacts

on:
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS'
        type: choice
        required: true
        default: 'ios'
        options:
          - ios
          - tvos
      arch:
        description: 'Target architecture'
        type: choice
        required: true
        default: 'arm64'
        options:
          - arm64
          - arm64e
      version:
        description: 'LibVLC version (optional, uses default if not specified)'
        type: string
        required: false
  push:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  actions: write

jobs:
  generate:
    name: Generate LibVLC (${{ github.event.inputs.target_os || 'ios' }}/${{ github.event.inputs.arch || 'arm64' }})
    runs-on: ${{ github.event.inputs.target_os == 'tvos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external dependencies needed - uses stdlib only
      
      - name: Generate LibVLC artifacts
        id: generate
        run: |
          python tools/generate_libvlc.py \
            --target-os ${{ github.event.inputs.target_os || 'ios' }} \
            --arch ${{ github.event.inputs.arch || 'arm64' }} \
            --output-dir ./dist
        shell: bash
      
      - name: Verify output
        run: |
          ls -la dist/
          ls -la dist/lib/
          ls -la dist/include/vlc/
      
      - name: Create release archive
        run: |
          cd dist
          zip -r ../libvlc-${{ github.event.inputs.target_os || 'ios' }}-${{ github.event.inputs.arch || 'arm64' }}.zip .
          cd ..
          ls -lh libvlc-*.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvlc-${{ github.event.inputs.target_os || 'ios' }}-${{ github.event.inputs.arch || 'arm64' }}
          path: libvlc-*.zip
          retention-days: 30
      
      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: libvlc-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}